name: Feature
description: A capability that fits the frozen graph and JobView contract.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Features that need Redis, Kafka, a 30B orchestrator, or a second talking VLM belong on the **Architecture lock** template, not here.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Talking VLM (InternVL behind geochat_* ids)
        - BIT / change masks
        - Grounding / SAM
        - Optical–SAR fusion
        - JobView / API
        - Analyze console
        - Persistence / PostGIS
        - Eval / traces
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: Analysts cannot export CHANGE polygons after a bi-temporal run.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      placeholder: Wire bit_cd output into spatial_features and JobView overlays[].
    validations:
      required: true
  - type: checkboxes
    id: locks
    attributes:
      label: Locks
      options:
        - label: This does not add Redis, Kafka, Celery, or WebSockets
          required: true
        - label: Graph tool IDs stay geochat_vqa / geochat_describe if this touches the talking VLM
          required: true
        - label: JobView remains the UI contract (no parallel response shape)
          required: true
