services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: satquery-postgres
    environment:
      POSTGRES_DB: satquery
      POSTGRES_USER: satquery
      POSTGRES_PASSWORD: satquery
    ports:
      - "5433:5432"
    volumes:
      - satquery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satquery -d satquery"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: satquery-redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: satquery-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - satquery_qdrant_data:/qdrant/storage

  nginx:
    image: nginx:alpine
    container_name: satquery-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  api:
    build: .
    container_name: satquery-api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+psycopg://satquery:satquery@postgres:5432/satquery
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1

  celery_worker:
    build: .
    container_name: satquery-celery-worker
    command: celery -A backend.worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
      - postgres
    environment:
      - DATABASE_URL=postgresql+psycopg://satquery:satquery@postgres:5432/satquery
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1

volumes:
  satquery_pgdata:
  satquery_qdrant_data:
